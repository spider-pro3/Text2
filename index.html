<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPIDER PRO ADMIN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    padding:20px;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:30px;
    letter-spacing:4px;
    margin:10px 0 25px;
}

.card{
    background:#050505;
    border:1px solid #fff;
    border-radius:22px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 0 20px rgba(255,255,255,.08);
}

label{
    display:block;
    font-size:12px;
    letter-spacing:2px;
    margin:0 0 8px;
}

input,textarea{
    width:100%;
    background:#000;
    color:#fff;
    border:1px solid #555;
    border-radius:14px;
    outline:none;
    padding:14px;
    font-size:14px;
    margin-bottom:16px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,textarea:focus{
    border-color:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.15);
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.switch{
    position:relative;
    width:58px;
    height:30px;
    flex-shrink:0;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#111;
    border:1px solid #777;
    border-radius:30px;
    cursor:pointer;
    transition:.25s;
}

.slider:before{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:3px;
    top:3px;
    background:#fff;
    border-radius:50%;
    transition:.25s;
}

.switch input:checked + .slider{
    background:#fff;
    border-color:#fff;
}

.switch input:checked + .slider:before{
    transform:translateX(28px);
    background:#000;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    width:100%;
    min-height:48px;
    border:1px solid #fff;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-weight:bold;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

button.dark{
    background:#000;
    color:#fff;
}

button.danger{
    background:#000;
    color:#fff;
    border-color:#fff;
}

.status{
    border-top:1px solid #333;
    margin-top:18px;
    padding-top:15px;
}

.statusLine{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    margin:8px 0;
}

.value{
    color:#aaa;
    text-align:right;
    word-break:break-all;
}

#log{
    margin-top:14px;
    padding:12px;
    border:1px solid #333;
    border-radius:12px;
    min-height:44px;
    font-size:12px;
    color:#ccc;
    white-space:pre-wrap;
    word-break:break-word;
}

.small{
    font-size:10px;
    color:#777;
    line-height:1.6;
    margin-top:10px;
}

@media(max-width:380px){
    body{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>SPIDER PRO</h1>

<div class="card">

<label>GITHUB RAW URL</label>

<input
    id="raw"
    type="text"
    placeholder="https://raw.githubusercontent.com/owner/repo/main/file.json"
>

<label>GITHUB TOKEN</label>

<input
    id="token"
    type="password"
    placeholder="GitHub token"
>

<div class="buttons">
    <button onclick="saveSettings()">SAVE</button>
    <button class="dark" onclick="loadFile()">LOAD</button>
</div>

<div class="status">

    <div class="statusLine">
        <span>CURRENT VERSION</span>
        <span class="value" id="version">-</span>
    </div>

    <div class="statusLine">
        <span>CURRENT SHA</span>
        <span class="value" id="sha">-</span>
    </div>

</div>

</div>


<div class="card">

<div class="row">

    <label style="margin:0">
        NOTICE ENABLED
    </label>

    <label class="switch">

        <input
            id="enabled"
            type="checkbox"
        >

        <span class="slider"></span>

    </label>

</div>

<br>

<label>MESSAGE</label>

<textarea
    id="message"
    placeholder="Write your notice..."
></textarea>

<label>MAX SHOW</label>

<input
    id="maxshow"
    type="number"
    min="1"
    value="3"
>

<div class="buttons">

    <button onclick="updateFile()">
        UPDATE
    </button>

    <button
        class="dark"
        onclick="disableNotice()"
    >
        DISABLE
    </button>

</div>

<br>

<button
    class="danger"
    onclick="clearMessage()"
>
    CLEAR MESSAGE
</button>

<div id="log">
Ready.
</div>

</div>

</div>

<script>

function $(id){
    return document.getElementById(id);
}

function log(text){
    $("log").textContent = text;
}

function saveSettings(){

    const raw =
        $("raw").value.trim();

    const token =
        $("token").value.trim();

    localStorage.setItem(
        "spider_raw",
        raw
    );

    localStorage.setItem(
        "spider_token",
        token
    );

    log("SETTINGS SAVED.");
}

function loadSettings(){

    $("raw").value =
        localStorage.getItem(
            "spider_raw"
        ) || "";

    $("token").value =
        localStorage.getItem(
            "spider_token"
        ) || "";
}

function parseRawUrl(raw){

    const u = new URL(raw);

    if(
        u.hostname !==
        "raw.githubusercontent.com"
    ){
        throw new Error(
            "INVALID GITHUB RAW URL"
        );
    }

    const parts =
        u.pathname
        .split("/")
        .filter(Boolean);

    if(parts.length < 4){
        throw new Error(
            "INVALID RAW URL"
        );
    }

    const owner = parts[0];

    const repo = parts[1];

    let branch;
    let path;

    if(
        parts[2] === "refs" &&
        parts[3] === "heads"
    ){

        if(parts.length < 5){
            throw new Error(
                "INVALID BRANCH PATH"
            );
        }

        branch = parts[4];

        path =
            parts
            .slice(5)
            .join("/");

    }else{

        branch = parts[2];

        path =
            parts
            .slice(3)
            .join("/");
    }

    if(
        !owner ||
        !repo ||
        !branch ||
        !path
    ){
        throw new Error(
            "COULD NOT PARSE RAW URL"
        );
    }

    return {
        owner:owner,
        repo:repo,
        branch:branch,
        path:path
    };
}

function getApiUrl(info){

    return (
        "https://api.github.com/repos/" +

        encodeURIComponent(
            info.owner
        ) +

        "/" +

        encodeURIComponent(
            info.repo
        ) +

        "/contents/" +

        info.path
            .split("/")
            .map(
                encodeURIComponent
            )
            .join("/") +

        "?ref=" +

        encodeURIComponent(
            info.branch
        )
    );
}
async function getFile(
    info,
    token
){

    const response =
        await fetch(
            getApiUrl(info),
            {
                method:"GET",

                cache:"no-store",

                headers:{
                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + token,

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Cache-Control":
                        "no-cache"
                }
            }
        );

    const text =
        await response.text();

    if(!response.ok){

        throw new Error(
            "GET ERROR " +
            response.status +
            "\n" +
            text
        );
    }

    const data =
        JSON.parse(text);

    if(
        !data.content ||
        !data.sha
    ){

        throw new Error(
            "INVALID GITHUB RESPONSE"
        );
    }

    const binary =
        atob(
            data.content.replace(
                /\s/g,
                ""
            )
        );

    const bytes =
        Uint8Array.from(
            binary,
            c => c.charCodeAt(0)
        );

    const jsonText =
        new TextDecoder(
            "utf-8"
        ).decode(bytes);

    return {
        sha:data.sha,
        json:JSON.parse(jsonText)
    };
}


function encodeBase64Utf8(text){

    const bytes =
        new TextEncoder()
        .encode(text);

    let binary = "";

    for(
        let i = 0;
        i < bytes.length;
        i++
    ){

        binary +=
            String.fromCharCode(
                bytes[i]
            );
    }

    return btoa(binary);
}


function buildJson(version){

    let max =
        parseInt(
            $("maxshow").value,
            10
        );

    if(
        !Number.isFinite(max) ||
        max < 1
    ){
        max = 1;
    }

    return {

        enabled:
            $("enabled").checked,

        message:
            $("message").value,

        max_show:
            max,

        version:
            version
    };
}


async function putFile(
    info,
    token,
    sha,
    json
){

    const content =
        JSON.stringify(
            json,
            null,
            2
        ) + "\n";

    const body = {

        message:
            "SPIDER PRO UPDATE v" +
            json.version,

        content:
            encodeBase64Utf8(
                content
            ),

        sha:
            sha,

        branch:
            info.branch
    };

    const response =
        await fetch(
            getApiUrl(info),
            {

                method:"PUT",

                headers:{

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + token,

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(body)
            }
        );

    const text =
        await response.text();

    if(!response.ok){

        throw new Error(
            "PUT ERROR " +
            response.status +
            "\n" +
            text
        );
    }

    return JSON.parse(text);
}


async function loadFile(){

    try{

        const raw =
            $("raw")
            .value
            .trim();

        const token =
            $("token")
            .value
            .trim();

        if(!raw){

            throw new Error(
                "RAW URL IS EMPTY"
            );
        }

        if(!token){

            throw new Error(
                "TOKEN IS EMPTY"
            );
        }

        const info =
            parseRawUrl(raw);

        log(
            "LOADING..."
        );

        const file =
            await getFile(
                info,
                token
            );

        const j =
            file.json || {};

        $("enabled").checked =
            !!j.enabled;

        $("message").value =
            j.message || "";

        $("maxshow").value =
            Math.max(
                1,
                parseInt(
                    j.max_show,
                    10
                ) || 3
            );

        const version =
            parseInt(
                j.version,
                10
            ) || 1;

        $("version")
            .textContent =
            version;

        $("sha")
            .textContent =
            file.sha;

        log(
            "LOAD SUCCESSFUL.\n" +
            "Version: " +
            version +
            "\nSHA: " +
            file.sha
        );

    }catch(e){

        log(
            "LOAD ERROR:\n" +
            e.message
        );
    }
}


async function updateFile(){

    try{

        const raw =
            $("raw")
            .value
            .trim();

        const token =
            $("token")
            .value
            .trim();

        if(!raw){

            throw new Error(
                "RAW URL IS EMPTY"
            );
        }

        if(!token){

            throw new Error(
                "TOKEN IS EMPTY"
            );
        }

        const info =
            parseRawUrl(raw);

        log(
            "GETTING LATEST FILE..."
        );

        const latest =
            await getFile(
                info,
                token
            );

        const currentJson =
            latest.json || {};

        const currentVersion =
            parseInt(
                currentJson.version,
                10
            ) || 1;

        const newVersion =
            currentVersion + 1;

        const json =
            buildJson(
                newVersion
            );

        log(
            "UPDATING...\n" +
            "New version: " +
            newVersion
        );

        const result =
            await putFile(
                info,
                token,
                latest.sha,
                json
            );

        const newSha =
            result.content &&
            result.content.sha
                ? result.content.sha
                : "-";

        $("version")
            .textContent =
            newVersion;

        $("sha")
            .textContent =
            newSha;

        log(
            "UPDATE SUCCESSFUL.\n" +
            "Version " +
            newVersion +
            " is now saved."
        );

    }catch(e){

        log(
            "UPDATE ERROR:\n" +
            e.message
        );
    }
          }
async function disableNotice(){

    try{

        const raw =
            $("raw")
            .value
            .trim();

        const token =
            $("token")
            .value
            .trim();

        if(!raw){

            throw new Error(
                "RAW URL IS EMPTY"
            );
        }

        if(!token){

            throw new Error(
                "TOKEN IS EMPTY"
            );
        }

        const info =
            parseRawUrl(raw);

        log(
            "DISABLING..."
        );

        const latest =
            await getFile(
                info,
                token
            );

        const j =
            latest.json || {};

        const version =
            parseInt(
                j.version,
                10
            ) || 1;

        j.enabled = false;

        j.version = version;

        const result =
            await putFile(
                info,
                token,
                latest.sha,
                j
            );

        const newSha =
            result.content &&
            result.content.sha
                ? result.content.sha
                : "-";

        $("enabled")
            .checked = false;

        $("version")
            .textContent =
            version;

        $("sha")
            .textContent =
            newSha;

        log(
            "NOTICE DISABLED.\n" +
            "Version remains: " +
            version
        );

    }catch(e){

        log(
            "DISABLE ERROR:\n" +
            e.message
        );
    }
}


function clearMessage(){

    $("message")
        .value = "";

    log(
        "MESSAGE CLEARED."
    );
}


loadSettings();

</script>

</body>
</html>
