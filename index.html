<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIDER PRO ADMIN</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 25px 16px 40px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 4px;
}

.header p {
    margin: 8px 0 0;
    color: #777;
    font-size: 12px;
    letter-spacing: 2px;
}

.card {
    background: #050505;
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
}

.label {
    display: block;
    margin: 0 0 8px;
    font-size: 11px;
    color: #999;
    letter-spacing: 1.5px;
}

input,
textarea {
    width: 100%;
    background: #000;
    color: #fff;
    border: 1px solid #333;
    border-radius: 12px;
    outline: none;
    padding: 14px;
    font-size: 14px;
    transition: .2s;
}

input:focus,
textarea:focus {
    border-color: #fff;
}

textarea {
    min-height: 130px;
    resize: vertical;
    line-height: 1.6;
}

.field {
    margin-bottom: 17px;
}

.switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 17px;
}

.switch-text strong {
    display: block;
    font-size: 14px;
}

.switch-text span {
    display: block;
    margin-top: 4px;
    color: #777;
    font-size: 11px;
}

.switch {
    width: 52px;
    height: 28px;
    position: relative;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    border: 1px solid #444;
    border-radius: 30px;
    background: #111;
    cursor: pointer;
    transition: .25s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: #777;
    transition: .25s;
}

.switch input:checked + .slider {
    background: #fff;
    border-color: #fff;
}

.switch input:checked + .slider:before {
    transform: translateX(24px);
    background: #000;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 12px;
    min-height: 48px;
    padding: 12px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .15s;
}

button:active {
    transform: scale(.97);
}

.primary {
    background: #fff;
    color: #000;
}

.secondary {
    background: #111;
    color: #fff;
    border: 1px solid #333;
}

.danger {
    background: #111;
    color: #fff;
    border: 1px solid #555;
}

.status {
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 14px;
    margin-top: 15px;
    font-size: 12px;
    line-height: 1.6;
    word-break: break-word;
}

.status-title {
    color: #777;
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-bottom: 5px;
}

.status.ok {
    border-color: #555;
}

.status.error {
    border-color: #777;
}

.info {
    color: #666;
    font-size: 10px;
    line-height: 1.6;
    margin-top: 10px;
}

.sha {
    color: #aaa;
    font-family: monospace;
    font-size: 10px;
    word-break: break-all;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>SPIDER PRO</h1>
        <p>REMOTE NOTICE ADMIN</p>
    </div>

    <!-- GITHUB -->
    <div class="card">

        <div class="field">
            <label class="label">RAW GITHUB LINK</label>
            <input
                id="rawUrl"
                type="url"
                placeholder="https://raw.githubusercontent.com/..."
                autocomplete="off">
        </div>

        <div class="field">
            <label class="label">GITHUB TOKEN</label>
            <input
                id="token"
                type="password"
                placeholder="GitHub Personal Access Token"
                autocomplete="off">
        </div>

        <div class="buttons">
            <button class="primary" onclick="saveSettings()">SAVE</button>
            <button class="secondary" onclick="loadFile()">LOAD</button>
        </div>

    </div>

    <!-- NOTICE -->
    <div class="card">

        <div class="switch-row">
            <div class="switch-text">
                <strong>NOTICE ENABLED</strong>
                <span>Show notice inside the application</span>
            </div>

            <label class="switch">
                <input id="enabled" type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="field">
            <label class="label">MESSAGE</label>
            <textarea
                id="message"
                placeholder="Enter notice message..."></textarea>
        </div>

        <div class="field">
            <label class="label">MAX SHOW</label>
            <input
                id="maxShow"
                type="number"
                min="1"
                step="1"
                value="3">
        </div>

        <div class="buttons">
            <button class="primary" onclick="updateFile()">UPDATE</button>
            <button class="secondary" onclick="disableNotice()">DISABLE</button>
        </div>

        <div style="height:10px"></div>

        <button
            class="secondary"
            style="width:100%"
            onclick="clearMessage()">
            CLEAR MESSAGE
        </button>

    </div>

    <!-- STATUS -->
    <div id="status" class="status">
        <div class="status-title">STATUS</div>
        <div id="statusText">Ready.</div>

        <div id="shaBox" class="hidden" style="margin-top:10px">
            <div class="status-title">CURRENT SHA</div>
            <div id="sha" class="sha"></div>
        </div>
    </div>

    <div class="info">
        The panel reads and updates text.json directly through the GitHub
        Contents API.
    </div>

</div>

<script>

const $ = id => document.getElementById(id);

/* =========================================================
   STORAGE
========================================================= */

function saveSettings() {

    const raw = $("rawUrl").value.trim();
    const token = $("token").value.trim();

    if (!raw) {
        setStatus("Raw GitHub link is required.", true);
        return;
    }

    if (!token) {
        setStatus("GitHub token is required.", true);
        return;
    }

    localStorage.setItem("spider_raw", raw);
    localStorage.setItem("spider_token", token);

    setStatus("Settings saved successfully.");
}


function loadSettings() {

    const raw = localStorage.getItem("spider_raw") || "";
    const token = localStorage.getItem("spider_token") || "";

    $("rawUrl").value = raw;
    $("token").value = token;
}


/* =========================================================
   RAW URL PARSER
========================================================= */

function parseRawUrl(raw) {

    let u;

    try {
        u = new URL(raw.trim());
    } catch (e) {
        throw new Error("Invalid URL.");
    }

    if (u.hostname !== "raw.githubusercontent.com") {
        throw new Error("URL must be a raw.githubusercontent.com link.");
    }

    let parts = u.pathname
        .split("/")
        .filter(Boolean);

    /*
       Supported:

       /owner/repo/main/file.json

       /owner/repo/refs/heads/main/file.json
    */

    if (parts.length < 4) {
        throw new Error("Invalid Raw GitHub URL.");
    }

    const owner = parts[0];
    const repo = parts[1];

    let branch;
    let pathParts;

    if (
        parts[2] === "refs" &&
        parts[3] === "heads"
    ) {

        if (parts.length < 6) {
            throw new Error("Invalid refs/heads Raw URL.");
        }

        branch = parts[4];
        pathParts = parts.slice(5);

    } else {

        branch = parts[2];
        pathParts = parts.slice(3);
    }

    if (!owner || !repo || !branch || pathParts.length === 0) {
        throw new Error("Could not parse repository information.");
    }

    return {
        owner: owner,
        repo: repo,
        branch: branch,
        path: pathParts.join("/")
    };
}


/* =========================================================
   API URL
========================================================= */

function getApiUrl(info) {

    const encodedPath = info.path
        .split("/")
        .map(function(part) {
            return encodeURIComponent(part);
        })
        .join("/");

    return (
        "https://api.github.com/repos/" +
        encodeURIComponent(info.owner) +
        "/" +
        encodeURIComponent(info.repo) +
        "/contents/" +
        encodedPath +
        "?ref=" +
        encodeURIComponent(info.branch)
    );
}


/* =========================================================
   HEADERS
========================================================= */

function getHeaders(token) {

    return {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + token,
        "X-GitHub-Api-Version": "2022-11-28"
    };
}


/* =========================================================
   GET FILE
========================================================= */

async function getFile(info, token) {

    const url = getApiUrl(info);

    const response = await fetch(url, {
        method: "GET",
        headers: getHeaders(token),
        cache: "no-store"
    });

    const text = await response.text();

    let data;

    try {
        data = JSON.parse(text);
    } catch (e) {
        throw new Error(
            "GitHub returned invalid JSON. HTTP " +
            response.status
        );
    }

    if (!response.ok) {

        let message =
            data.message ||
            ("GitHub API error: HTTP " + response.status);

        throw new Error(message);
    }

    if (!data.sha) {
        throw new Error("SHA was not returned by GitHub.");
    }

    return data;
}


/* =========================================================
   BASE64 DECODE UTF-8
========================================================= */

function decodeBase64UTF8(base64) {

    base64 = base64.replace(/\s/g, "");

    const binary = atob(base64);

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new TextDecoder("utf-8").decode(bytes);
}


/* =========================================================
   BASE64 ENCODE UTF-8
========================================================= */

function encodeBase64UTF8(text) {

    const bytes = new TextEncoder().encode(text);

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        binary += String.fromCharCode.apply(
            null,
            bytes.subarray(
                i,
                Math.min(i + chunkSize, bytes.length)
            )
        );
    }

    return btoa(binary);
}


/* =========================================================
   LOAD FILE
========================================================= */

async function loadFile() {

    try {

        const raw = $("rawUrl").value.trim();
        const token = $("token").value.trim();

        if (!raw) {
            throw new Error("Raw GitHub link is required.");
        }

        if (!token) {
            throw new Error("GitHub token is required.");
        }

        localStorage.setItem("spider_raw", raw);
        localStorage.setItem("spider_token", token);

        setStatus("Connecting to GitHub...");

        const info = parseRawUrl(raw);

        setStatus(
            "Reading " +
            info.owner +
            "/" +
            info.repo +
            "/" +
            info.path +
            "..."
        );

        const data = await getFile(info, token);

        localStorage.setItem("spider_sha", data.sha);

        showSha(data.sha);

        if (data.content) {

            const jsonText =
                decodeBase64UTF8(data.content);

            let json;

            try {
                json = JSON.parse(jsonText);
            } catch (e) {
                throw new Error(
                    "text.json contains invalid JSON."
                );
            }

            $("enabled").checked =
                json.enabled === true;

            $("message").value =
                json.message || "";

            const max =
                parseInt(json.max_show, 10);

            $("maxShow").value =
                Number.isFinite(max) && max > 0
                    ? max
                    : 3;
        }

        setStatus(
            "File loaded successfully."
        );

    } catch (error) {

        setStatus(
            "LOAD ERROR: " + error.message,
            true
        );
    }
}


/* =========================================================
   BUILD JSON
========================================================= */

function buildJson() {

    let max =
        parseInt(
            $("maxShow").value,
            10
        );

    if (!Number.isFinite(max) || max < 1) {
        max = 3;
    }

    return {
        enabled: $("enabled").checked,
        message: $("message").value,
        max_show: max
    };
}


/* =========================================================
   UPDATE FILE
========================================================= */

async function updateFile() {

    try {

        const raw = $("rawUrl").value.trim();
        const token = $("token").value.trim();

        if (!raw) {
            throw new Error("Raw GitHub link is required.");
        }

        if (!token) {
            throw new Error("GitHub token is required.");
        }

        localStorage.setItem("spider_raw", raw);
        localStorage.setItem("spider_token", token);

        setStatus(
            "Getting latest SHA from GitHub..."
        );

        const info = parseRawUrl(raw);

        /*
           IMPORTANT:
           Always fetch latest SHA before PUT.
           This prevents stale SHA / 409 problems.
        */

        const current =
            await getFile(info, token);

        const latestSha =
            current.sha;

        showSha(latestSha);

        const json =
            buildJson();

        const jsonText =
            JSON.stringify(
                json,
                null,
                2
            ) + "\n";

        const encoded =
            encodeBase64UTF8(jsonText);

        const apiUrl =
            getApiUrl(info);

        setStatus(
            "Uploading new text.json..."
        );

        const response =
            await fetch(
                apiUrl,
                {
                    method: "PUT",

                    headers:
                        Object.assign(
                            {},
                            getHeaders(token),
                            {
                                "Content-Type":
                                    "application/json"
                            }
                        ),

                    body: JSON.stringify({
                        message:
                            "Update SPIDER PRO notice",

                        content:
                            encoded,

                        sha:
                            latestSha,

                        branch:
                            info.branch
                    })
                }
            );

        const responseText =
            await response.text();

        let result;

        try {
            result =
                JSON.parse(responseText);
        } catch (e) {
            throw new Error(
                "GitHub returned invalid response. HTTP " +
                response.status
            );
        }

        if (!response.ok) {

            throw new Error(
                result.message ||
                ("GitHub update failed: HTTP " +
                 response.status)
            );
        }

        const newSha =
            result.content &&
            result.content.sha
                ? result.content.sha
                : "";

        if (newSha) {
            localStorage.setItem(
                "spider_sha",
                newSha
            );

            showSha(newSha);
        }

        setStatus(
            "UPDATE SUCCESSFUL. text.json has been updated."
        );

    } catch (error) {

        setStatus(
            "UPDATE ERROR: " +
            error.message,
            true
        );
    }
}


/* =========================================================
   DISABLE
========================================================= */

async function disableNotice() {

    $("enabled").checked = false;

    await updateFile();
}


/* =========================================================
   CLEAR MESSAGE
========================================================= */

function clearMessage() {

    $("message").value = "";

    setStatus(
        "Message field cleared."
    );
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, error) {

    const box = $("status");

    $("statusText").textContent =
        message;

    box.classList.remove(
        "ok",
        "error"
    );

    if (error) {
        box.classList.add("error");
    } else {
        box.classList.add("ok");
    }
}


/* =========================================================
   SHOW SHA
========================================================= */

function showSha(value) {

    if (!value) {
        $("shaBox").classList.add("hidden");
        return;
    }

    $("shaBox").classList.remove("hidden");

    $("sha").textContent =
        value;
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadSettings();

</script>

</body>
  </html>
