<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIDER PRO ADMIN</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:92%;
    max-width:520px;
    margin:30px auto;
}

.card{
    background:#080808;
    border:1px solid #fff;
    border-radius:22px;
    padding:22px;
    box-shadow:0 0 35px rgba(255,255,255,.08);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    letter-spacing:3px;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:7px;
    margin-bottom:25px;
}

label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin:15px 3px 7px;
}

input,
textarea{
    width:100%;
    background:#000;
    color:#fff;
    border:1px solid #444;
    border-radius:12px;
    padding:13px;
    outline:none;
    font-size:14px;
}

input:focus,
textarea:focus{
    border-color:#fff;
}

textarea{
    min-height:120px;
    resize:vertical;
    line-height:1.8;
}

.row{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    flex:1;
    border:1px solid #fff;
    border-radius:12px;
    padding:13px;
    background:#fff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button.dark{
    background:#000;
    color:#fff;
}

button:disabled{
    opacity:.4;
}

.switchbox{
    margin-top:15px;
    border:1px solid #333;
    border-radius:12px;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.switch{
    position:relative;
    width:48px;
    height:26px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#222;
    border:1px solid #777;
    border-radius:30px;
    cursor:pointer;
}

.slider:before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    left:3px;
    top:3px;
    background:#fff;
    border-radius:50%;
    transition:.25s;
}

.switch input:checked + .slider{
    background:#fff;
}

.switch input:checked + .slider:before{
    transform:translateX(22px);
    background:#000;
}

.status{
    margin-top:16px;
    padding:12px;
    border:1px solid #333;
    border-radius:12px;
    text-align:center;
    color:#aaa;
    font-size:12px;
    min-height:40px;
}

.footer{
    text-align:center;
    color:#444;
    font-size:10px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">SPIDER PRO</div>
<div class="subtitle">REMOTE NOTICE ADMIN</div>

<label>RAW GITHUB LINK</label>
<input
    id="raw"
    type="url"
    placeholder="https://raw.githubusercontent.com/..."
>

<label>GITHUB TOKEN</label>
<input
    id="token"
    type="password"
    placeholder="github_pat_..."
>

<div class="row">
    <button onclick="saveSettings()">SAVE</button>
    <button class="dark" onclick="loadSettings()">LOAD</button>
</div>

<label>MESSAGE</label>
<textarea
    id="message"
    placeholder="متن پیام..."
></textarea>

<label>MAX SHOW</label>
<input
    id="maxShow"
    type="number"
    min="1"
    value="3"
>

<div class="switchbox">
    <span>NOTICE ENABLED</span>

    <label class="switch">
        <input id="enabled" type="checkbox">
        <span class="slider"></span>
    </label>
</div>

<div class="row">
    <button onclick="getFile()">REFRESH</button>
    <button onclick="updateFile()">UPDATE</button>
</div>

<div class="row">
    <button class="dark" onclick="disableNotice()">DISABLE</button>
    <button class="dark" onclick="clearMessage()">CLEAR</button>
</div>

<div id="status" class="status">
    Ready
</div>

<div class="footer">
    SPIDER PRO ADMIN PANEL
</div>

</div>
</div>

<script>

const $ = id => document.getElementById(id);

/* =========================
   LOCAL SETTINGS
========================= */

function saveSettings(){

    const raw = $("raw").value.trim();
    const token = $("token").value.trim();

    if(!raw){
        setStatus("RAW LINK وارد نشده");
        return;
    }

    if(!token){
        setStatus("TOKEN وارد نشده");
        return;
    }

    localStorage.setItem("spider_raw",raw);
    localStorage.setItem("spider_token",token);

    setStatus("تنظیمات ذخیره شد");
}

function loadSettings(){

    $("raw").value =
        localStorage.getItem("spider_raw") || "";

    $("token").value =
        localStorage.getItem("spider_token") || "";

    setStatus("تنظیمات بارگذاری شد");
}

/* =========================
   RAW URL PARSER
========================= */

function parseRawUrl(){

    const raw = $("raw").value.trim();

    let u;

    try{
        u = new URL(raw);
    }catch(e){
        throw new Error("RAW LINK نامعتبر است");
    }

    if(
        u.hostname !== "raw.githubusercontent.com"
    ){
        throw new Error("لینک باید Raw GitHub باشد");
    }

    const parts =
        u.pathname.split("/").filter(Boolean);

    if(parts.length < 4){
        throw new Error("RAW LINK کامل نیست");
    }

    return {
        owner:parts[0],
        repo:parts[1],
        branch:parts[2],
        path:parts.slice(3).join("/")
    };
}

/* =========================
   GET FILE
========================= */

async function getFile(){

    try{

        const token =
            $("token").value.trim();

        if(!token){
            throw new Error("TOKEN وارد نشده");
        }

        const info = parseRawUrl();

        setStatus("در حال دریافت...");

        const api =
            "https://api.github.com/repos/"
            + encodeURIComponent(info.owner)
            + "/"
            + encodeURIComponent(info.repo)
            + "/contents/"
            + info.path
            + "?ref="
            + encodeURIComponent(info.branch);

        const res = await fetch(api,{
            method:"GET",
            headers:{
                "Accept":"application/vnd.github+json",
                "Authorization":"Bearer "+token,
                "X-GitHub-Api-Version":"2022-11-28"
            },
            cache:"no-store"
        });

        if(!res.ok){

            let msg = "";

            try{
                const x = await res.json();
                msg = x.message || "";
            }catch(e){}

            throw new Error(
                "GitHub: "
                + res.status
                + (msg ? " - "+msg : "")
            );
        }

        const data = await res.json();

        if(!data.content){
            throw new Error("محتوای فایل دریافت نشد");
        }

        const binary =
            atob(data.content.replace(/\n/g,""));

        const bytes =
            new Uint8Array(binary.length);

        for(let i=0;i<binary.length;i++){
            bytes[i] =
                binary.charCodeAt(i);
        }

        const text =
            new TextDecoder("utf-8").decode(bytes);

        const json =
            JSON.parse(text);

        $("enabled").checked =
            json.enabled === true;

        $("message").value =
            json.message || "";

        $("maxShow").value =
            Number(json.max_show || 3);

        localStorage.setItem(
            "spider_sha",
            data.sha
        );

        localStorage.setItem(
            "spider_raw",
            $("raw").value.trim()
        );

        localStorage.setItem(
            "spider_token",
            token
        );

        setStatus("اطلاعات با موفقیت دریافت شد");

    }catch(e){

        setStatus(e.message);
    }
}

/* =========================
   UPDATE GITHUB
========================= */

async function updateFile(){

    try{

        const token =
            $("token").value.trim();

        if(!token){
            throw new Error("TOKEN وارد نشده");
        }

        const info = parseRawUrl();

        let sha =
            localStorage.getItem("spider_sha");

        /*
         * اگر SHA نداریم، اول فایل را
         * از GitHub می‌گیریم.
         */

        if(!sha){

            setStatus("در حال دریافت اطلاعات فایل...");

            const getApi =
                "https://api.github.com/repos/"
                + encodeURIComponent(info.owner)
                + "/"
                + encodeURIComponent(info.repo)
                + "/contents/"
                + info.path
                + "?ref="
                + encodeURIComponent(info.branch);

            const getRes =
                await fetch(getApi,{
                    headers:{
                        "Accept":
                            "application/vnd.github+json",
                        "Authorization":
                            "Bearer "+token,
                        "X-GitHub-Api-Version":
                            "2022-11-28"
                    },
                    cache:"no-store"
                });

            if(!getRes.ok){
                throw new Error(
                    "خطا در دریافت SHA: "
                    + getRes.status
                );
            }

            const getData =
                await getRes.json();

            sha = getData.sha;
        }

        const json = {
            enabled:$("enabled").checked,
            message:$("message").value,
            max_show:Math.max(
                1,
                parseInt($("maxShow").value || "3")
            )
        };

        const text =
            JSON.stringify(json,null,2);

        const bytes =
            new TextEncoder().encode(text);

        let binary = "";

        for(let i=0;i<bytes.length;i++){
            binary += String.fromCharCode(bytes[i]);
        }

        const base64 =
            btoa(binary);

        setStatus("در حال آپدیت GitHub...");

        const api =
            "https://api.github.com/repos/"
            + encodeURIComponent(info.owner)
            + "/"
            + encodeURIComponent(info.repo)
            + "/contents/"
            + info.path;

        const body = {
            message:"Update SPIDER PRO notice",
            content:base64,
            sha:sha,
            branch:info.branch
        };

        const res =
            await fetch(api,{
                method:"PUT",
                headers:{
                    "Accept":
                        "application/vnd.github+json",
                    "Authorization":
                        "Bearer "+token,
                    "Content-Type":
                        "application/json",
                    "X-GitHub-Api-Version":
                        "2022-11-28"
                },
                body:JSON.stringify(body)
            });

        const data =
            await res.json();

        if(!res.ok){

            throw new Error(
                "GitHub: "
                + res.status
                + " - "
                + (data.message || "Update failed")
            );
        }

        if(
            data.content &&
            data.content.sha
        ){
            localStorage.setItem(
                "spider_sha",
                data.content.sha
            );
        }

        localStorage.setItem(
            "spider_raw",
            $("raw").value.trim()
        );

        localStorage.setItem(
            "spider_token",
            token
        );

        setStatus("با موفقیت روی GitHub ذخیره شد");

    }catch(e){

        /*
         * اگر SHA قدیمی شده باشد،
         * دوباره SHA را می‌گیریم.
         */

        if(
            String(e.message).includes("409")
        ){
            localStorage.removeItem("spider_sha");
            setStatus(
                "SHA تغییر کرده؛ دوباره UPDATE را بزن"
            );
            return;
        }

        setStatus(e.message);
    }
}

/* =========================
   DISABLE
========================= */

function disableNotice(){

    $("enabled").checked = false;

    updateFile();
}

/* =========================
   CLEAR
========================= */

function clearMessage(){

    $("message").value = "";
}

/* =========================
   STATUS
========================= */

function setStatus(text){

    $("status").textContent =
        text;
}

/* =========================
   STARTUP
========================= */

window.addEventListener("load",function(){

    $("raw").value =
        localStorage.getItem("spider_raw") || "";

    $("token").value =
        localStorage.getItem("spider_token") || "";

});

</script>

</body>
  </html>
